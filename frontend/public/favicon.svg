<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B15" />
      <stop offset="50%" stop-color="#140E2C" />
      <stop offset="100%" stop-color="#090C16" />
    </linearGradient>

    <linearGradient id="favP" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="favWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.45" />

  <!-- Soundwave Arc Accent -->
  <path d="M 52 18 A 12 12 0 0 1 52 32" fill="none" stroke="url(#favWave)" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- P Compound Glyph (High Contrast & Legibility) -->
  <path fill-rule="evenodd"
        d="
          M 16 18
          A 5 5 0 0 1 21 13
          H 36
          C 45 13 51 18 51 25
          C 51 32 45 37 36 37
          H 27
          A 2 2 0 0 0 25 39
          V 48
          A 4.5 4.5 0 0 1 16 48
          Z

          M 26 21
          H 35
          C 39 21 42 22.8 42 25
          C 42 27.2 39 29 35 29
          H 26
          A 1.5 1.5 0 0 1 24.5 27.5
          V 22.5
          A 1.5 1.5 0 0 1 26 21
          Z
        "
        fill="url(#favP)"
        stroke="#FFFFFF"
        stroke-width="0.6"
        stroke-opacity="0.6" />

  <!-- Center AI Nexus Spark -->
  <circle cx="33.5" cy="25" r="4.5" fill="#38BDF8" opacity="0.4" />
  <path d="M 33.5 20.5 Q 33.5 25 38 25 Q 33.5 25 33.5 29.5 Q 33.5 25 29 25 Q 33.5 25 33.5 20.5 Z"
        fill="#FFFFFF"
        filter="url(#favGlow)" />
  <circle cx="33.5" cy="25" r="1.2" fill="#67E8F9" />
</svg>
