<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="favTorso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="favHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="favWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Avatar Silhouette -->
  <path d="
    M 12 52
    C 12 37 19 32 27 32
    C 35 32 42 37 42 52
    H 12
    Z
  " fill="url(#favTorso)" />

  <!-- Head -->
  <circle cx="27" cy="22" r="8" fill="url(#favHead)" />

  <!-- Core White Identity Dot -->
  <circle cx="27" cy="42" r="2.2" fill="#FFFFFF" />

  <!-- Voice Waves (2 bold high-contrast arcs) -->
  <g fill="none" stroke="url(#favWave)" stroke-linecap="round">
    <path d="M 39 17 C 44 20.5 44 25.5 39 29" stroke-width="2.6" />
    <path d="M 45 13 C 52 18.5 52 29.5 45 35" stroke-width="2.6" />
  </g>
</svg>
