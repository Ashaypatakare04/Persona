<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B15" />
      <stop offset="50%" stop-color="#140E2C" />
      <stop offset="100%" stop-color="#090C16" />
    </linearGradient>

    <linearGradient id="favShieldL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="favShieldR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="favWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.45" />

  <!-- Voice Soundwave Arcs (Left & Right) -->
  <path d="M 54 22 A 14 14 0 0 1 54 42" fill="none" stroke="url(#favWave)" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <path d="M 10 22 A 14 14 0 0 0 10 42" fill="none" stroke="url(#favWave)" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Outer Cyber Shield Facets -->
  <!-- Left Facet -->
  <path d="M 32 11 L 17 20 C 16 31 20 44 32 53 L 32 11 Z"
        fill="url(#favShieldL)"
        stroke="#FFFFFF"
        stroke-width="0.7"
        stroke-opacity="0.5" />

  <!-- Right Facet -->
  <path d="M 32 11 L 47 20 C 48 31 44 44 32 53 L 32 11 Z"
        fill="url(#favShieldR)"
        stroke="#FFFFFF"
        stroke-width="0.7"
        stroke-opacity="0.5" />

  <!-- Inner Diamond Chamber -->
  <polygon points="32,19 42,32 32,45 22,32" fill="#080C16" stroke="#38BDF8" stroke-width="1" />

  <!-- Center AI Neural Spark -->
  <circle cx="32" cy="32" r="5" fill="#38BDF8" opacity="0.45" />
  <path d="M 32 26 Q 32 32 38 32 Q 32 32 32 38 Q 32 32 26 32 Q 32 32 32 26 Z"
        fill="#FFFFFF"
        filter="url(#favGlow)" />
  <circle cx="32" cy="32" r="1.3" fill="#67E8F9" />
</svg>
