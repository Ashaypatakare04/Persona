<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="logoCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="textGradMaster" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="torsoLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <linearGradient id="headLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="waveLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="880" height="240" rx="28" fill="url(#logoCanvasBg)" stroke="#1E293B" stroke-width="1.6" />

  <!-- Left Icon Emblem (Scaled 180x180 viewBox) -->
  <g transform="translate(45, 30) scale(0.35)" filter="url(#logoShadow)">
    <rect width="512" height="512" rx="120" fill="#090D16" stroke="#334155" stroke-width="4" />
    <g transform="translate(220, 256)">
      <path d="M -115 135 C -115 35 -65 0 0 0 C 65 0 115 35 115 135 C 115 144 108 152 98 152 H -98 C -108 152 -115 144 -115 135 Z" fill="url(#torsoLogo)" />
      <circle cx="0" cy="-68" r="48" fill="url(#headLogo)" />
      <circle cx="0" cy="56" r="14" fill="#FFFFFF" />
      <g fill="none" stroke="url(#waveLogo)" stroke-linecap="round">
        <path d="M 88 -90 C 114 -72 114 -32 88 -14" stroke-width="14" />
        <path d="M 124 -112 C 160 -86 160 -18 124 8" stroke-width="14" />
        <path d="M 160 -134 C 206 -100 206 -4 160 30" stroke-width="12" opacity="0.65" />
      </g>
    </g>
  </g>

  <!-- Typography: PERSONA -->
  <g transform="translate(265, 102)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-size="64"
          font-weight="900"
          letter-spacing="5"
          fill="url(#textGradMaster)">PERSONA</text>
  </g>

  <!-- Subtitle: PERSONAL AI REPRESENTATIVE -->
  <g transform="translate(267, 142)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-size="15"
          font-weight="600"
          letter-spacing="3.8"
          fill="#94A3B8">PERSONAL AI REPRESENTATIVE</text>
  </g>

  <!-- Feature Chips Bar -->
  <g transform="translate(267, 168)">
    <rect x="0" y="0" width="136" height="24" rx="12" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#38BDF8" />
    <text x="74" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" text-anchor="middle">POLICY GOVERNED</text>

    <rect x="144" y="0" width="120" height="24" rx="12" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="156" cy="12" r="3.5" fill="#A855F7" />
    <text x="210" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" text-anchor="middle">VOICE &amp; CHAT</text>

    <rect x="272" y="0" width="134" height="24" rx="12" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="284" cy="12" r="3.5" fill="#10B981" />
    <text x="345" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" text-anchor="middle">L0-L4 AUTONOMY</text>

    <rect x="414" y="0" width="130" height="24" rx="12" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="426" cy="12" r="3.5" fill="#F59E0B" />
    <text x="485" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" text-anchor="middle">SECURITY SHIELD</text>
  </g>
</svg>
