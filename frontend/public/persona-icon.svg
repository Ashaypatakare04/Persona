<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B15" />
      <stop offset="35%" stop-color="#0D1124" />
      <stop offset="70%" stop-color="#140E2C" />
      <stop offset="100%" stop-color="#090C16" />
    </linearGradient>

    <!-- Outer Rim Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.35" />
    </linearGradient>

    <!-- Unified "P" Glyph Dynamic Gradient -->
    <linearGradient id="pBodyGrad" x1="10%" y1="90%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="25%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="75%" stop-color="#A855F7" />
      <stop offset="90%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Specular Rim Gradient for 3D Bevel -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Voice Soundwaves Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="topCyanGlow" cx="82%" cy="16%" r="65%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomPurpleGlow" cx="18%" cy="84%" r="65%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4338CA" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="122" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="122" fill="url(#topCyanGlow)" />
  <rect width="512" height="512" rx="122" fill="url(#bottomPurpleGlow)" />

  <!-- Outer Border -->
  <rect width="506" height="506" x="3" y="3" rx="119" fill="none" stroke="url(#borderGrad)" stroke-width="2.2" />

  <!-- Subtle Cybernetic Radar Reticles -->
  <g opacity="0.16" stroke="#818CF8" stroke-width="1.2" fill="none">
    <circle cx="256" cy="256" r="218" stroke-dasharray="6 12" />
    <circle cx="256" cy="256" r="186" opacity="0.6" stroke-dasharray="3 9" />
    <line x1="256" y1="34" x2="256" y2="48" stroke="#38BDF8" stroke-width="2" />
    <line x1="256" y1="464" x2="256" y2="478" stroke="#38BDF8" stroke-width="2" />
    <line x1="34" y1="256" x2="48" y2="256" stroke="#38BDF8" stroke-width="2" />
    <line x1="464" y1="256" x2="478" y2="256" stroke="#38BDF8" stroke-width="2" />
  </g>

  <!-- Ambient Radiant Halo behind the Loop -->
  <circle cx="265" cy="205" r="145" fill="url(#centerGlow)" />

  <!-- Soundwave Voice Arcs (Calling / Telephony / Audio STT-TTS) -->
  <g fill="none" stroke="url(#waveGrad)" stroke-linecap="round">
    <path d="M 404 150 A 85 85 0 0 1 404 260" stroke-width="4.5" opacity="0.85" />
    <path d="M 430 128 A 120 120 0 0 1 430 282" stroke-width="3" stroke-dasharray="6 8" opacity="0.55" />
    <path d="M 456 106 A 155 155 0 0 1 456 304" stroke-width="2" opacity="0.32" />
  </g>

  <!-- === P GLYPH (Refined Compound Path with Fillets and Rounded Inner Counter) === -->
  <g filter="url(#glyphShadow)">
    <path fill-rule="evenodd"
          d="
            M 140 152
            A 34 34 0 0 1 174 118
            H 282
            C 346 118 392 156 392 205
            C 392 254 346 292 282 292
            H 220
            A 16 16 0 0 0 204 308
            V 378
            A 32 32 0 0 1 140 378
            Z

            M 218 174
            H 276
            C 308 174 332 188 332 205
            C 332 222 308 236 276 236
            H 218
            A 12 12 0 0 1 206 224
            V 186
            A 12 12 0 0 1 218 174
            Z
          "
          fill="url(#pBodyGrad)"
          stroke="url(#bevelGrad)"
          stroke-width="2.5" />
  </g>

  <!-- Inner Loop Cutout Deep Backdrop (Enhanced Depth) -->
  <path d="
          M 218 174
          H 276
          C 308 174 332 188 332 205
          C 332 222 308 236 276 236
          H 218
          A 12 12 0 0 1 206 224
          V 186
          A 12 12 0 0 1 218 174
          Z
        "
        fill="#090D1A"
        opacity="0.92" />

  <!-- Inner Loop Rim Neon Glow Line -->
  <path d="
          M 218 174
          H 276
          C 308 174 332 188 332 205
          C 332 222 308 236 276 236
          H 218
          A 12 12 0 0 1 206 224
          V 186
          A 12 12 0 0 1 218 174
          Z
        "
        fill="none"
        stroke="url(#pBodyGrad)"
        stroke-width="2.2"
        opacity="0.8" />

  <!-- Futuristic Vertical Light-Bar on Stem -->
  <rect x="166" y="278" width="6" height="96" rx="3" fill="#FFFFFF" opacity="0.85" filter="url(#softGlow)" />
  <rect x="168" y="284" width="2" height="84" rx="1" fill="#FFFFFF" />

  <!-- === AI SPARK / NEURAL NEXUS (Centered in Counter at 262, 205) === -->
  <g transform="translate(262, 205)">
    <!-- Radial aura -->
    <circle cx="0" cy="0" r="36" fill="url(#centerGlow)" filter="url(#coreGlow)" />

    <!-- 4-point radiant diamond star -->
    <path d="M 0 -32 Q 0 0 32 0 Q 0 0 0 32 Q 0 0 -32 0 Q 0 0 0 -32 Z" fill="#38BDF8" opacity="0.85" filter="url(#softGlow)" />
    <!-- Bright white inner star -->
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#FFFFFF" filter="url(#coreGlow)" />

    <!-- Small diagonal spark facets -->
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

    <!-- Central radiant core -->
    <circle cx="0" cy="0" r="5.5" fill="#67E8F9" />
    <circle cx="0" cy="0" r="2.8" fill="#FFFFFF" />
  </g>

  <!-- === SATELLITE POLICY GUARD NODE === -->
  <g filter="url(#softGlow)">
    <circle cx="340" cy="358" r="9.5" fill="#06B6D4" />
    <circle cx="340" cy="358" r="4" fill="#FFFFFF" />
    <circle cx="340" cy="358" r="18" fill="none" stroke="#06B6D4" stroke-width="1.6" opacity="0.5" stroke-dasharray="3 3" />
    <path d="M 204 366 Q 272 384 340 358" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 5" opacity="0.65" />
  </g>
</svg>
