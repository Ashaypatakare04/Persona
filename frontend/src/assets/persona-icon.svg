<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Torso: Deep Royal Indigo & Violet -->
    <linearGradient id="torsoMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Head: Luminous Violet to Indigo -->
    <linearGradient id="headMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Voice Soundwaves: Vibrant Cyan -->
    <linearGradient id="waveMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgMaster)" />
  <rect width="506" height="506" x="3" y="3" rx="117" fill="none" stroke="#334155" stroke-width="1.8" stroke-opacity="0.5" />

  <!-- Centered Representative Vocal Persona Group -->
  <g transform="translate(220, 256)" filter="url(#cleanShadow)">
    <!-- 1. The Persona Torso / Shoulders -->
    <path d="
      M -115 135
      C -115 35 -65 0 0 0
      C 65 0 115 35 115 135
      C 115 144 108 152 98 152
      H -98
      C -108 152 -115 144 -115 135
      Z
    " fill="url(#torsoMaster)" />

    <!-- 2. The Persona Mind / Head -->
    <circle cx="0" cy="-68" r="48" fill="url(#headMaster)" />

    <!-- 3. Core Identity Node on Torso -->
    <circle cx="0" cy="56" r="14" fill="#FFFFFF" />

    <!-- 4. Voice Waves (3 Concentric Acoustic Arcs) -->
    <g fill="none" stroke="url(#waveMaster)" stroke-linecap="round">
      <path d="M 88 -90 C 114 -72 114 -32 88 -14" stroke-width="13" />
      <path d="M 124 -112 C 160 -86 160 -18 124 8" stroke-width="13" />
      <path d="M 160 -134 C 206 -100 206 -4 160 30" stroke-width="11" opacity="0.65" />
    </g>
  </g>
</svg>
