<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="bannerBgMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="bannerBorderMaster" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="heroTextMaster" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="torsoBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <linearGradient id="headBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="waveBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bannerBgMaster)" />
  <rect width="1276" height="416" x="2" y="2" rx="22" fill="none" stroke="url(#bannerBorderMaster)" stroke-width="1.8" />

  <!-- Left Emblem (260x260) -->
  <g transform="translate(100, 78) scale(0.51)" filter="url(#heroShadow)">
    <rect width="512" height="512" rx="120" fill="#090D16" stroke="#334155" stroke-width="4" />
    <g transform="translate(220, 256)">
      <path d="M -115 135 C -115 35 -65 0 0 0 C 65 0 115 35 115 135 C 115 144 108 152 98 152 H -98 C -108 152 -115 144 -115 135 Z" fill="url(#torsoBanner)" />
      <circle cx="0" cy="-68" r="48" fill="url(#headBanner)" />
      <circle cx="0" cy="56" r="14" fill="#FFFFFF" />
      <g fill="none" stroke="url(#waveBanner)" stroke-linecap="round">
        <path d="M 88 -90 C 114 -72 114 -32 88 -14" stroke-width="14" />
        <path d="M 124 -112 C 160 -86 160 -18 124 8" stroke-width="14" />
        <path d="M 160 -134 C 206 -100 206 -4 160 30" stroke-width="12" opacity="0.65" />
      </g>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(420, 165)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-size="82"
          font-weight="900"
          letter-spacing="6"
          fill="url(#heroTextMaster)">PERSONA</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(422, 215)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-size="21"
          font-weight="600"
          letter-spacing="4.5"
          fill="#94A3B8">AUTONOMOUS PERSONAL AI REPRESENTATIVE</text>
  </g>

  <!-- Tagline Paragraph -->
  <g transform="translate(422, 252)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="15"
          font-weight="400"
          fill="#64748B">Policy-governed intelligence acting on your behalf across calls, SMS, email, and live chat.</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(422, 290)">
    <g transform="translate(0, 0)">
      <rect width="170" height="32" rx="16" fill="#1E293B" opacity="0.75" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#38BDF8" />
      <text x="96" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">MULTI-STAGE SAFETY</text>
    </g>

    <g transform="translate(182, 0)">
      <rect width="186" height="32" rx="16" fill="#1E293B" opacity="0.75" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#A855F7" />
      <text x="104" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">VOICE STT/TTS ENGINE</text>
    </g>

    <g transform="translate(380, 0)">
      <rect width="180" height="32" rx="16" fill="#1E293B" opacity="0.75" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#10B981" />
      <text x="101" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">DYNAMIC AUTONOMY</text>
    </g>

    <g transform="translate(572, 0)">
      <rect width="176" height="32" rx="16" fill="#1E293B" opacity="0.75" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#F59E0B" />
      <text x="99" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">POLICY &amp; RISK ENGINE</text>
    </g>
  </g>
</svg>
