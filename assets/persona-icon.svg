<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B15" />
      <stop offset="35%" stop-color="#0D1124" />
      <stop offset="70%" stop-color="#140E2C" />
      <stop offset="100%" stop-color="#090C16" />
    </linearGradient>

    <!-- Outer Rim Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3" />
    </linearGradient>

    <!-- Left Shield Facet Gradient -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="75%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Right Shield Facet Gradient -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="30%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Specular Center Ridge & Bevel -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Voice Soundwaves Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="topCyanGlow" cx="82%" cy="16%" r="65%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomPurpleGlow" cx="18%" cy="84%" r="65%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4338CA" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="122" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="122" fill="url(#topCyanGlow)" />
  <rect width="512" height="512" rx="122" fill="url(#bottomPurpleGlow)" />

  <!-- Outer Border -->
  <rect width="506" height="506" x="3" y="3" rx="119" fill="none" stroke="url(#borderGrad)" stroke-width="2.2" />

  <!-- Subtle Cyber Reticles & Circular Telemetry -->
  <g opacity="0.16" stroke="#818CF8" stroke-width="1.2" fill="none">
    <circle cx="256" cy="256" r="218" stroke-dasharray="6 12" />
    <circle cx="256" cy="256" r="186" opacity="0.6" stroke-dasharray="3 9" />
    <line x1="256" y1="34" x2="256" y2="48" stroke="#38BDF8" stroke-width="2" />
    <line x1="256" y1="464" x2="256" y2="478" stroke="#38BDF8" stroke-width="2" />
    <line x1="34" y1="256" x2="48" y2="256" stroke="#38BDF8" stroke-width="2" />
    <line x1="464" y1="256" x2="478" y2="256" stroke="#38BDF8" stroke-width="2" />
  </g>

  <!-- Ambient Radiant Halo behind Center Core -->
  <circle cx="256" cy="250" r="150" fill="url(#centerGlow)" />

  <!-- Telephony & Voice Audio Pulse Waves (Left & Right Flanks) -->
  <g fill="none" stroke="url(#waveGrad)" stroke-linecap="round">
    <path d="M 408 175 A 95 95 0 0 1 408 325" stroke-width="4.5" opacity="0.85" />
    <path d="M 436 150 A 132 132 0 0 1 436 350" stroke-width="3" stroke-dasharray="6 8" opacity="0.55" />
    <path d="M 104 175 A 95 95 0 0 0 104 325" stroke-width="4.5" opacity="0.85" />
    <path d="M 76 150 A 132 132 0 0 0 76 350" stroke-width="3" stroke-dasharray="6 8" opacity="0.55" />
  </g>

  <!-- === THE CYBERNETIC SHIELD PRISM === -->
  <g filter="url(#shieldShadow)">
    <!-- LEFT SHIELD FACET -->
    <path d="
      M 256 94
      L 140 160
      C 134 246 160 340 256 414
      L 256 94
      Z
    "
    fill="url(#shieldLeft)"
    stroke="url(#bevelGrad)"
    stroke-width="2" />

    <!-- RIGHT SHIELD FACET -->
    <path d="
      M 256 94
      L 372 160
      C 378 246 352 340 256 414
      L 256 94
      Z
    "
    fill="url(#shieldRight)"
    stroke="url(#bevelGrad)"
    stroke-width="2" />

    <!-- Inner Core Cutout Diamond Chamber -->
    <polygon points="256,156 332,250 256,344 180,250"
             fill="#080C18"
             stroke="url(#borderGrad)"
             stroke-width="2.5" />
  </g>

  <!-- Inner Diamond Chamber Accent Neon Glow Rim -->
  <polygon points="256,162 326,250 256,338 186,250"
           fill="none"
           stroke="#38BDF8"
           stroke-width="1.2"
           stroke-opacity="0.75" />

  <!-- Voice Frequency Equalizer Bars inside Core Chamber -->
  <g stroke="#38BDF8" stroke-linecap="round" opacity="0.85">
    <line x1="194" y1="250" x2="210" y2="250" stroke-width="2.5" />
    <line x1="202" y1="240" x2="202" y2="260" stroke-width="2" />
    <line x1="302" y1="250" x2="318" y2="250" stroke-width="2.5" />
    <line x1="310" y1="240" x2="310" y2="260" stroke-width="2" />
  </g>

  <!-- Specular Center Seam / Ridge Highlight -->
  <line x1="256" y1="94" x2="256" y2="156" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <line x1="256" y1="344" x2="256" y2="414" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- === CENTRAL AI NEURAL SPARK NEXUS === -->
  <g transform="translate(256, 250)">
    <circle cx="0" cy="0" r="38" fill="url(#centerGlow)" filter="url(#coreGlow)" />
    <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#38BDF8" opacity="0.9" filter="url(#softGlow)" />
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#FFFFFF" filter="url(#coreGlow)" />
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <circle cx="0" cy="0" r="6" fill="#67E8F9" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- Top Apex Satellite Node -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="94" r="7" fill="#38BDF8" />
    <circle cx="256" cy="94" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
